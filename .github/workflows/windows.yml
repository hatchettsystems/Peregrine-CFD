name: windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-opencascade-x64-windows-v1
      - name: Install OpenCASCADE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\vcpkg-cache | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opencascade:x64-windows --binarysource="files,C:\vcpkg-cache,readwrite"
          "OCCT_ROOT=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Test
        run: cargo test --release --workspace
      - name: Build
        run: cargo build --release -p peregrine-app -p peregrine-cli
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: peregrine-windows-x64
          path: dist/peregrine-windows-x64.zip
