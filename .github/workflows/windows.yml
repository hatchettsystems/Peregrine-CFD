name: windows
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Prebuilt OpenCASCADE from conda-forge: minutes instead of the ~hour a vcpkg source build takes.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false
      - name: Install OpenCASCADE (prebuilt)
        shell: pwsh
        run: |
          conda create -y -p C:\occt -c conda-forge occt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem C:\occt\Library\lib -Filter "TK*.lib" | Select-Object -First 5
          "OCCT_ROOT=C:\occt\Library" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\occt\Library\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Test
        run: cargo test --release --workspace
      - name: Build
        run: cargo build --release -p peregrine-app -p peregrine-cli
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      # Only the newest build is kept: each zip is large, and old ones fill the repository's artifact storage,
      # which makes the upload hang and fail.
      - name: Delete older Windows artifacts
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            for (const a of arts) {
              if (a.name === 'peregrine-windows-x64') {
                await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
              }
            }
      - uses: actions/upload-artifact@v4
        with:
          name: peregrine-windows-x64
          path: dist/peregrine-windows-x64.zip
          retention-days: 7
          compression-level: 0
