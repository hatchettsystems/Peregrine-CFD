name: windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Prebuilt OpenCASCADE from conda-forge: minutes instead of the ~hour a vcpkg source build takes.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false
      - name: Install OpenCASCADE (prebuilt)
        shell: pwsh
        run: |
          conda create -y -p C:\occt -c conda-forge occt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem C:\occt\Library\lib -Filter "TK*.lib" | Select-Object -First 5
          "OCCT_ROOT=C:\occt\Library" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\occt\Library\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Test
        run: cargo test --release --workspace
      - name: Build
        run: cargo build --release -p peregrine-app -p peregrine-cli
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: peregrine-windows-x64
          path: dist/peregrine-windows-x64.zip
