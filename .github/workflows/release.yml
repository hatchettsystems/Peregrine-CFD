name: release
# Builds the Windows programs and publishes them as a GitHub Release with a downloadable zip.
# Run it from the Actions tab (Run workflow, enter a version such as v0.1.0) or push a tag starting with v.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false
      - name: Install OpenCASCADE (prebuilt)
        shell: pwsh
        run: |
          conda create -y -p C:\occt -c conda-forge occt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "OCCT_ROOT=C:\occt\Library" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\occt\Library\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build
        run: cargo build --release -p peregrine-app -p peregrine-cli
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          Copy-Item dist\peregrine-windows-x64.zip "dist\Peregrine-CFD-$tag-windows-x64.zip"
          $notes = "Windows x64 build. Download the zip, extract it anywhere, and run peregrine-app.exe (the OpenCASCADE DLLs it needs are included and must stay beside it). A graphics card with Vulkan or DirectX 12 support is used automatically for the solver."
          gh release create $tag "dist\Peregrine-CFD-$tag-windows-x64.zip" --target "${{ github.sha }}" --title "Peregrine CFD $tag" --notes $notes
